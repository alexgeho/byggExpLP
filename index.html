    <script>
      // ============ FORM VALIDATION ============
      const form = document.getElementById("demo-form");
      const formView = document.getElementById("form-view");
      const formSuccess = document.getElementById("form-success");
      const successMsg = document.getElementById("success-msg");

      function setError(field, hasError) {
        const grp = form.querySelector(`[data-field="${field}"]`);
        if (grp) grp.classList.toggle("error", hasError);
      }

      // phone formatter (light touch)
      const phoneInput = document.getElementById("f-phone");
      phoneInput.addEventListener("input", (e) => {
        let v = e.target.value.replace(/[^\d+]/g, "");
        if (v && !v.startsWith("+")) v = "+" + v;
        e.target.value = v;
        setError("phone", false);
      });
      document
        .getElementById("f-name")
        .addEventListener("input", () => setError("name", false));
      document
        .getElementById("f-email")
        .addEventListener("input", () => setError("email", false));

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = form.name.value.trim();
        const email = form.email.value.trim();
        const phone = form.phone.value.trim();

        let ok = true;
        if (name.length < 2) {
          setError("name", true);
          ok = false;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          setError("email", true);
          ok = false;
        }
        if (phone.replace(/\D/g, "").length < 10) {
          setError("phone", true);
          ok = false;
        }
        if (!ok) return;

        successMsg.textContent = `Спасибо, ${name.split(" ")[0]}! Свяжемся с тобой в течение часа.`;
        formView.style.display = "none";
        formSuccess.style.display = "block";
      });

      // ============ REVEAL ON SCROLL ============
      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("in");
              io.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.12 },
      );
      document
        .querySelectorAll(
          ".pain-card, .conseq-card, .benefit-card, .feature-chip, .step, .pricing-card",
        )
        .forEach((el) => {
          el.classList.add("reveal");
          io.observe(el);
        });
    </script>
